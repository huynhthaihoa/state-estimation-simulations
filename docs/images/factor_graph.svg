<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d">
<title id="t">A factor graph with every factor kind</title>
<desc id="d">Poses x0 to x3 in a row, joined in pairs by odometry factors (squares). An IMU factor runs in parallel to the odometry factor between x1 and x2. Landmark l0 is joined to x1 and x2 by camera factors. A loop-closure factor joins x0 and x3. A prior factor touches x0 only and a GPS factor touches x3 only. Variables are circles, factors are squares, and every edge joins a circle to a square.</desc>
