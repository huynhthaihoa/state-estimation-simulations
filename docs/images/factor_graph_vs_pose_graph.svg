<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 853" width="1100" height="853" role="img" aria-labelledby="t d">
<title id="t">Factor graph versus pose graph</title>
<desc id="d">Top: the factor graph of the first figure, with the parts a pose graph drops faded: landmark l0, the camera factors and the GPS factor. Bottom: the pose graph, which keeps poses x0 to x3 and the factors between them, drawn as edges: three odometry edges, an IMU edge between x1 and x2 and a loop-closure edge, with x0 anchored by its prior.</desc>
