<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">State Estimation Simulations</title>
<desc id="d">Pipeline overview: sensors feed a front-end (PnP, triangulation, visual-inertial initialization), whose constraints go to two back-end families - Kalman filtering and factor-graph optimization - producing a trajectory and map estimate, all built on Lie-group and Jacobian foundations.</desc>
