<text x="48.0" y="96.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="start">From-scratch pose estimation on SO(3) / SE(3) · NumPy and manif side by side</text>
