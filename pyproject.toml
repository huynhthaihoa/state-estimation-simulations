[project]
name = "state-estimation-simulations"
version = "0.1.0"
description = "A collection of simulations for state estimation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
manif = ["manifpy"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.uv.sources]
manifpy = { path = "../manif" }
